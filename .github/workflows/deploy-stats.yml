name: Deploy statistics dashboard
on:
  workflow_dispatch:
  push:
    paths:
      - 'stats-worker/**'
      - '.github/workflows/deploy-stats.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy stats-worker/worker.js --config stats-worker/wrangler.jsonc
