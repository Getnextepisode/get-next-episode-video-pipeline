name: Generate and publish story short

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: Story ID to promote (for example tenants-only)
        required: true
        type: string
  schedule:
    - cron: '30 18 * * *'

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick python3-pip
          python3 -m pip install --upgrade google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Build vertical short
        env:
          STORY_ID: ${{ inputs.story_id || 'tenants-only' }}
          APP_URL: https://get-next-episode-bot.byd-karaoke-israel.workers.dev
          VIDEO_PIPELINE_SECRET: ${{ secrets.VIDEO_PIPELINE_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p build
          curl -fsSL -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" "$APP_URL/api/video-promo?story=${STORY_ID}" -o build/manifest.json
          curl -fsSL "$(jq -r .cover build/manifest.json)" -o build/cover.png
          curl -fsSL "$(jq -r .audio build/manifest.json)" -o build/voice.mp3
          curl -fsSL https://raw.githubusercontent.com/Getnextepisode/get-next-episode-video-pipeline/main/assets/get-next-episode-logo-red.png.b64 -o build/logo.png.b64
          base64 --decode build/logo.png.b64 > build/logo.png
          python3 - <<'PY'
          import json, re
          m=json.load(open('build/manifest.json',encoding='utf-8'))
          clean=lambda s: re.sub(r'[^A-Za-z0-9\u0590-\u05FF .,!?-]', '', str(s))
          open('build/title.txt','w',encoding='utf-8').write(clean(m.get('title','Get Next Episode')))
          open('build/tagline.txt','w',encoding='utf-8').write(clean(m.get('teaser','')))
          import textwrap
          teaser=clean(m.get('teaser',''))
          open('build/tagline.txt','w',encoding='utf-8').write('\n'.join(textwrap.wrap(teaser,32)[:3]))
          genre=clean(m.get('genre',m.get('category','ORIGINAL STORY')))
          open('build/genre.txt','w',encoding='utf-8').write(genre.upper())
          rating=m.get('rating',4.8)
          readers=m.get('readers',m.get('views',''))
          open('build/details.txt','w',encoding='utf-8').write(clean(f"{rating} / 5   |   {readers} readers"))
          words=teaser.split()
          pivot=max(1,len(words)//2)
          msg1=' '.join(words[:pivot])
          msg2=' '.join(words[pivot:])
          open('build/message1.txt','w',encoding='utf-8').write('\\n'.join(textwrap.wrap(msg1,18)[:2]))
          open('build/message2.txt','w',encoding='utf-8').write('\\n'.join(textwrap.wrap(msg2,18)[:2]))
          open('build/promise.txt','w',encoding='utf-8').write("סיפורים שנקראים כמו צ'אט.\\nנשמעים כמו סדרה.")
          open('build/cta.txt','w',encoding='utf-8').write("לקרוא או להאזין לפרק הראשון")
          PY
          ffmpeg -y -f lavfi -i color=c=black:s=1080x1920:d=2 -i build/logo.png -f lavfi -i sine=frequency=440:duration=2 \
            -filter_complex "[1:v]scale=360:-1[logo];[0:v][logo]overlay=(W-w)/2:650,format=yuv420p[v]" \
            -map "[v]" -map 2:a -t 2 -c:v libx264 -c:a aac -ar 48000 -ac 2 build/intro.mp4

          ffmpeg -y -i build/cover.png -i build/logo.png \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,drawbox=x=0:y=0:w=1080:h=1920:color=black@0.34:t=fill[bg];[1:v]scale=190:-1[logo];[bg][logo]overlay=55:45,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='GET NEXT':fontcolor=white:fontsize=54:x=265:y=82,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='EPISODE':fontcolor=0xff1838:fontsize=54:x=570:y=82,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='READ  •  LISTEN  •  CHAT STORIES':fontcolor=white:fontsize=30:x=265:y=155,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=build/genre.txt:fontcolor=0xff1838:fontsize=42:x=70:y=330,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=build/title.txt:fontcolor=white:fontsize=118:borderw=4:bordercolor=black@0.9:x=70:y=410,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=build/promise.txt:fontcolor=white:fontsize=48:line_spacing=16:x=85:y=650,drawbox=x=65:y=820:w=480:h=230:color=0x11151d@0.88:t=fill,drawbox=x=65:y=820:w=480:h=230:color=white@0.25:t=3,drawbox=x=105:y=885:w=58:h=58:color=0xff1838@0.95:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='▶':fontcolor=white:fontsize=34:x=118:y=895,drawbox=x=195:y=895:w=8:h=40:color=0xff1838:t=fill,drawbox=x=215:y=875:w=8:h=80:color=white:t=fill,drawbox=x=235:y=890:w=8:h=50:color=0xff1838:t=fill,drawbox=x=255:y=865:w=8:h=100:color=white:t=fill,drawbox=x=275:y=885:w=8:h=60:color=0xff1838:t=fill,drawbox=x=295:y=875:w=8:h=80:color=white:t=fill,drawbox=x=315:y=895:w=8:h=40:color=0xff1838:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='0:37':fontcolor=white@0.8:fontsize=32:x=430:y=905,drawbox=x=585:y=820:w=420:h=115:color=0x11151d@0.88:t=fill,drawbox=x=585:y=955:w=360:h=115:color=0x11151d@0.88:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:textfile=build/message1.txt:fontcolor=white:fontsize=32:line_spacing=8:x=615:y=840,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:textfile=build/message2.txt:fontcolor=white:fontsize=32:line_spacing=8:x=615:y=975,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=build/details.txt:fontcolor=0xf5c451:fontsize=46:x=85:y=1160,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CHAT  |  AUDIO':fontcolor=white:fontsize=36:x=650:y=1165,drawbox=x=135:y=1515:w=810:h=150:color=0xd90920@0.96:t=fill,drawbox=x=135:y=1515:w=810:h=150:color=0xff4357:t=4,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=build/cta.txt:fontcolor=white:fontsize=48:x=(w-text_w)/2:y=1560,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='@GetNextEpisodeBot':fontcolor=0xff1838:fontsize=48:x=(w-text_w)/2:y=1715,format=rgba[v]" \
            -map "[v]" -frames:v 1 build/story-cover.png

          ffmpeg -y -loop 1 -i build/story-cover.png -i build/voice.mp3 -t 35 \
            -vf "format=yuv420p" -map 0:v -map 1:a -c:v libx264 -r 25 -c:a aac -ar 48000 -ac 2 -af "aresample=48000,loudnorm=I=-16:TP=-1.5:LRA=11" -shortest build/main.mp4

          ffmpeg -y -f lavfi -i color=c=black:s=1080x1920:d=2 -i build/logo.png -f lavfi -i sine=frequency=330:duration=2 \
            -filter_complex "[1:v]scale=300:-1[logo];[0:v][logo]overlay=(W-w)/2:560,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CONTINUE THE STORY':fontcolor=white:fontsize=52:x=(w-text_w)/2:y=1050,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='@GetNextEpisodeBot':fontcolor=red:fontsize=48:x=(w-text_w)/2:y=1140,format=yuv420p[v]" \
            -map "[v]" -map 2:a -t 2 -c:v libx264 -c:a aac -ar 48000 -ac 2 build/outro.mp4

          printf "file '%s'\\nfile '%s'\\nfile '%s'\\n" "$PWD/build/intro.mp4" "$PWD/build/main.mp4" "$PWD/build/outro.mp4" > build/concat.txt
          ffmpeg -y -f concat -safe 0 -i build/concat.txt -c:v libx264 -c:a aac -ar 48000 -ac 2 -movflags +faststart build/story-short.mp4

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          with open('build/manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          title = manifest.get('title', 'GetNextEpisode')
          teaser = manifest.get('teaser', '')
          creds = Credentials(
              token=None,
              refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YOUTUBE_CLIENT_ID'],
              client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/youtube.upload'],
          )
          youtube = build('youtube', 'v3', credentials=creds)
          body = {
              'snippet': {
                  'title': f'{title} — רק עוד פרק',
                  'description': f'{teaser}\n\nהמשך הסיפור מחכה ב-GetNextEpisodeBot: https://t.me/GetNextEpisodeBot',
                  'categoryId': '24',
                  'tags': ['shorts', 'story', 'GetNextEpisode', 'רק עוד פרק'],
              },
              'status': {
                  'privacyStatus': 'public',
                  'selfDeclaredMadeForKids': False,
              },
          }
          result = youtube.videos().insert(
              part='snippet,status', body=body,
              media_body=MediaFileUpload('build/story-short.mp4', mimetype='video/mp4', resumable=True),
          ).execute()
          print('Uploaded YouTube video:', result['id'])
          PY
