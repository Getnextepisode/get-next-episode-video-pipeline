name: Generate and publish story short

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: Story ID to promote (for example tenants-only)
        required: true
        type: string
  schedule:
    - cron: '30 18 * * *'

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install --upgrade google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Build vertical short
        env:
          STORY_ID: ${{ inputs.story_id || 'tenants-only' }}
          APP_URL: https://get-next-episode-bot.byd-karaoke-israel.workers.dev
          VIDEO_PIPELINE_SECRET: ${{ secrets.VIDEO_PIPELINE_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p build
          curl -fsSL -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" "$APP_URL/api/video-promo?story=${STORY_ID}" -o build/manifest.json
          curl -fsSL "$(jq -r .cover build/manifest.json)" -o build/cover.png
          curl -fsSL "$(jq -r .audio build/manifest.json)" -o build/voice.mp3
          jq -r '.teaser' build/manifest.json > build/caption.txt
          python3 - <<'PY'
          import json,re
          t=json.load(open('build/manifest.json',encoding='utf-8')).get('teaser','')
          words=t.split(); dur=35.0/max(1,len(words))
          def ts(x): return f'{int(x//3600):02d}:{int(x%3600//60):02d}:{x%60:06.3f}'.replace('.',',')
          out=[]
          for i,w in enumerate(words):
              out += [str(i+1), f'{ts(i*dur)} --> {ts((i+1)*dur)}', w, '']
          open('build/caption.srt','w',encoding='utf-8').write(chr(10).join(out))
          PY
          test -s build/caption.srt
          CAPTION_PATH=$(realpath build/caption.srt)
          ffmpeg -y -loop 1 -i build/cover.png -i build/voice.mp3 -t 35 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0005,1.12)':d=1050:s=1080x1920,subtitles=${CAPTION_PATH}:force_style='FontName=DejaVu Sans,FontSize=28,Bold=1,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BackColour=&H99000000,BorderStyle=4,Alignment=5,MarginV=500',format=yuv420p" \
            -c:v libx264 -c:a aac -shortest build/story-short.mp4

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          with open('build/manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          title = manifest.get('title', 'GetNextEpisode')
          teaser = manifest.get('teaser', '')
          creds = Credentials(
              token=None,
              refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YOUTUBE_CLIENT_ID'],
              client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/youtube.upload'],
          )
          youtube = build('youtube', 'v3', credentials=creds)
          body = {
              'snippet': {
                  'title': f'{title} — רק עוד פרק',
                  'description': f'{teaser}\n\nהמשך הסיפור מחכה ב-GetNextEpisodeBot: https://t.me/GetNextEpisodeBot',
                  'categoryId': '24',
                  'tags': ['shorts', 'story', 'GetNextEpisode', 'רק עוד פרק'],
              },
              'status': {
                  'privacyStatus': 'public',
                  'selfDeclaredMadeForKids': False,
              },
          }
          result = youtube.videos().insert(
              part='snippet,status', body=body,
              media_body=MediaFileUpload('build/story-short.mp4', mimetype='video/mp4', resumable=True),
          ).execute()
          print('Uploaded YouTube video:', result['id'])
          PY
