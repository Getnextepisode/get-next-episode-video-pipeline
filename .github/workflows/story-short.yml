name: Generate and publish story short

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: Story ID to promote (for example tenants-only)
        required: true
        type: string
  schedule:
    - cron: '30 18 * * *'

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install --upgrade google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Build vertical short
        env:
          STORY_ID: ${{ inputs.story_id || 'tenants-only' }}
          APP_URL: https://get-next-episode-bot.byd-karaoke-israel.workers.dev
          VIDEO_PIPELINE_SECRET: ${{ secrets.VIDEO_PIPELINE_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p build
          curl -fsSL -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" "$APP_URL/api/video-promo?story=${STORY_ID}" -o build/manifest.json
          curl -fsSL "$(jq -r .cover build/manifest.json)" -o build/cover.png
          curl -fsSL "$(jq -r .audio build/manifest.json)" -o build/voice.mp3
          python3 - <<'PY'
import json
m=json.load(open('build/manifest.json',encoding='utf-8'))
clean=lambda s: ''.join(ch for ch in str(s) if ord(ch)<0x1f000 or ('\u0590'<=ch<='\u05ff') or ch.isalnum() or ch.isspace() or ch in '.,!?-')
open('build/title.txt','w',encoding='utf-8').write(clean(m.get('title','Get Next Episode')))
open('build/tagline.txt','w',encoding='utf-8').write(clean(m.get('teaser','')))
PY
          jq -r '.teaser' build/manifest.json > build/tagline.txt
          ffmpeg -y -f lavfi -i color=c=black:s=1080x1920:d=2 -f lavfi -i sine=frequency=440:duration=2 -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='GET NEXT':fontcolor=white:fontsize=70:x=(w-text_w)/2:y=780,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='EPISODE':fontcolor=red:fontsize=70:x=(w-text_w)/2:y=870,format=yuv420p" -c:v libx264 -c:a aac -shortest build/intro.mp4
          ffmpeg -y -loop 1 -i build/cover.png -i build/voice.mp3 -t 35 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.00035,1.10)':d=1050:s=1080x1920,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='GET NEXT':fontcolor=white:fontsize=48:borderw=2:bordercolor=black@0.8:x=300:y=105,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='EPISODE':fontcolor=red:fontsize=48:borderw=2:bordercolor=black@0.8:x=610:y=105,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=build/title.txt:fontcolor=white:fontsize=108:line_spacing=10:borderw=3:bordercolor=black@0.85:x=(w-text_w)/2:y=650:box=1:boxcolor=black@0.55:boxborderw=24,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:textfile=build/tagline.txt:fontcolor=white:fontsize=52:line_spacing=10:borderw=2:bordercolor=black@0.85:x=(w-text_w)/2:y=1120:box=1:boxcolor=black@0.55:boxborderw=20,format=yuv420p" \
            -c:v libx264 -c:a aac -shortest build/main.mp4
          ffmpeg -y -f lavfi -i color=c=black:s=1080x1920:d=2 -f lavfi -i sine=frequency=330:duration=2 -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='READ THE NEXT EPISODE':fontcolor=white:fontsize=54:x=(w-text_w)/2:y=820,format=yuv420p" -c:v libx264 -c:a aac -shortest build/outro.mp4
          printf "file '%s'\\nfile '%s'\\nfile '%s'\\n" "$PWD/build/intro.mp4" "$PWD/build/main.mp4" "$PWD/build/outro.mp4" > build/concat.txt
          ffmpeg -y -f concat -safe 0 -i build/concat.txt -c:v libx264 -c:a aac -movflags +faststart build/story-short.mp4

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          with open('build/manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          title = manifest.get('title', 'GetNextEpisode')
          teaser = manifest.get('teaser', '')
          creds = Credentials(
              token=None,
              refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YOUTUBE_CLIENT_ID'],
              client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/youtube.upload'],
          )
          youtube = build('youtube', 'v3', credentials=creds)
          body = {
              'snippet': {
                  'title': f'{title} — רק עוד פרק',
                  'description': f'{teaser}\n\nהמשך הסיפור מחכה ב-GetNextEpisodeBot: https://t.me/GetNextEpisodeBot',
                  'categoryId': '24',
                  'tags': ['shorts', 'story', 'GetNextEpisode', 'רק עוד פרק'],
              },
              'status': {
                  'privacyStatus': 'public',
                  'selfDeclaredMadeForKids': False,
              },
          }
          result = youtube.videos().insert(
              part='snippet,status', body=body,
              media_body=MediaFileUpload('build/story-short.mp4', mimetype='video/mp4', resumable=True),
          ).execute()
          print('Uploaded YouTube video:', result['id'])
          PY
