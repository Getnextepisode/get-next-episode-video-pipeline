name: Generate and publish story short

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: Story ID to promote, or next for today's story; backlog videos publish in scheduled batches
        required: false
        default: next
        type: string
      publish_to_youtube:
        description: Publish the finished short to YouTube
        required: false
        default: true
        type: boolean
      publish_to_facebook:
        description: Publish a Reel and a Page post on Facebook
        required: false
        default: true
        type: boolean
  schedule:
    # GitHub cron uses UTC. These two times cover Israel daylight and standard time;
    # the check selects exactly one based on Israel's current UTC offset.
    - cron: '20 10 * * *'
    - cron: '20 11 * * *'
    - cron: '20 12 * * *'
    - cron: '20 13 * * *'

jobs:
  schedule-check:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        env:
          REQUESTED_STORY_ID: ${{ inputs.story_id || 'next' }}
        run: |
          set -euo pipefail
          anchor_date='2026-10-02'
          israel_date=$(TZ=Asia/Jerusalem date +'%Y-%m-%d')

          should_run=false
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            israel_offset=$(TZ=Asia/Jerusalem date +'%z')
            schedule_cron='${{ github.event.schedule }}'
            case "$schedule_cron:$israel_offset" in
              "20 10 * * *:+0300"|"20 11 * * *:+0200")
                # Keep the 13:20 daily story/video schedule, starting after the current YouTube limit resets.
                [[ "$israel_date" > "$anchor_date" || "$israel_date" == "$anchor_date" ]] && should_run=true
                ;;
              "20 12 * * *:+0300"|"20 13 * * *:+0200")
                # Backlog videos run later in the day, in small groups of eight.
                if [[ "$israel_date" > "$anchor_date" || "$israel_date" == "$anchor_date" ]]; then
                  anchor_epoch=$(date -u -d "$anchor_date" +%s)
                  today_epoch=$(date -u -d "$israel_date" +%s)
                  day_index=$(( (today_epoch - anchor_epoch) / 86400 ))
                  (( day_index * 8 < 54 )) && should_run=true
                fi
                ;;
              *) ;;
            esac
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REQUESTED_STORY_ID" == "all" ]]; then
              echo "Backlog runs only on the scheduled daily batches."
            elif [[ "$israel_date" > "$anchor_date" || "$israel_date" == "$anchor_date" ]]; then
              should_run=true
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "Israel local date=$israel_date; workflow event=$GITHUB_EVENT_NAME; schedule=${{ github.event.schedule }}; should-run=$should_run."

  story-selection:
    needs: schedule-check
    runs-on: ubuntu-latest
    outputs:
      story-ids: ${{ steps.select.outputs.story_ids }}
    steps:
      - id: select
        env:
          REQUESTED_STORY_ID: ${{ inputs.story_id || 'next' }}
        run: |
          set -euo pipefail
          backlog=( file_404 last_inheritance unsent_message midnight_platform blue_room glass_code night_shift the_last_key silent_witness beneath_the_bridge borrowed_time the_seventh_floor echoes_of_home false_identity the_rainy_room closed_circuit the_paper_boat final_call the_hollow_house second_chance the_signal broken_portrait the_night_market no_return_address half_light the_empty_train nine_minutes the_wind_diary deep_water the_missing_note thirteen_steps our_summer mirror_game the_hidden_station red_line the_salt_letter blackout the_lantern one_more_song the_forgotten_name cold_case_17 the_orange_door off_the_record the_final_guest glass_heart the_sleeping_city little_lies tide_turns the_final_page the_tidal_map the_wandering_library the_sky_route knocks_in_the_wall the_last_frame )
          anchor_date='2026-10-02'
          israel_date=$(TZ=Asia/Jerusalem date +'%Y-%m-%d')
          schedule_cron='${{ github.event.schedule }}'

          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$schedule_cron" != "20 10 * * *" && "$schedule_cron" != "20 11 * * *" ]]; then
            mode='backlog'
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_STORY_ID" == "all" ]]; then
            mode='backlog'
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            mode='next'
          else
            mode="$REQUESTED_STORY_ID"
          fi

          if [[ "$mode" == "backlog" ]]; then
            anchor_epoch=$(date -u -d "$anchor_date" +%s)
            today_epoch=$(date -u -d "$israel_date" +%s)
            day_index=$(( (today_epoch - anchor_epoch) / 86400 ))
            start_index=$(( day_index * 8 ))
            selected=( "${backlog[@]:start_index:8}" )
            story_ids=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -s -c .)
            echo "Selected backlog batch $((day_index + 1)) starting at story $((start_index + 1))."
          elif [[ "$mode" == "next" ]]; then
            story_ids='["next"]'
          else
            story_ids=$(printf '%s\n' "$mode" | jq -R . | jq -s -c .)
          fi
          echo "story_ids=$story_ids" >> "$GITHUB_OUTPUT"

  render-and-publish:
    needs: [schedule-check, story-selection]
    if: needs.schedule-check.outputs.should-run == 'true'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        story_id: ${{ fromJSON(needs.story-selection.outputs.story-ids) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick python3-pip fonts-noto-core
          python3 -m pip install --upgrade Pillow google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Build vertical short
        id: build-video
        env:
          STORY_ID: ${{ matrix.story_id }}
          APP_URL: https://saliio.com
          VIDEO_PIPELINE_SECRET: ${{ secrets.VIDEO_PIPELINE_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHOULD_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_youtube }}
          PUBLISH_FACEBOOK: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_facebook }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID || '61594944391329' }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p build

          if [[ "$STORY_ID" == "next" ]]; then
            curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 --max-time 240 \
              -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" -X POST \
              "$APP_URL/api/daily-story" -o build/daily-story.json
            STORY_ID=$(jq -er '.id | select(test("^daily_[0-9]{8}$"))' build/daily-story.json)
            echo "Created or resumed today's story with Hebrew episode 1: $STORY_ID"
          fi

          echo "story_id=$STORY_ID" >> "$GITHUB_OUTPUT"
          youtube_promotion=$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" "$APP_URL/api/promo-status?story=$STORY_ID&platform=youtube")
          facebook_reel_promotion=$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" "$APP_URL/api/promo-status?story=$STORY_ID&platform=facebook_reel")
          facebook_post_promotion=$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" "$APP_URL/api/promo-status?story=$STORY_ID&platform=facebook_post")
          youtube_status=$(jq -r '.status // "ready"' <<< "$youtube_promotion")
          facebook_reel_status=$(jq -r '.status // "ready"' <<< "$facebook_reel_promotion")
          facebook_post_status=$(jq -r '.status // "ready"' <<< "$facebook_post_promotion")
          echo "youtube_already_published=$([[ "$youtube_status" == published ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "facebook_reel_already_published=$([[ "$facebook_reel_status" == published ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "facebook_post_already_published=$([[ "$facebook_post_status" == published ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [[ "$youtube_status" == published ]]; then
            youtube_id=$(jq -r '.youtube_video_id // empty' <<< "$youtube_promotion")
            if [[ -n "$youtube_id" ]]; then jq -n --arg videoId "$youtube_id" '{videoId:$videoId}' > build/youtube-upload.json; fi
          fi
          facebook_configured=false
          if [[ -n "$META_PAGE_ID" && -n "$META_PAGE_ACCESS_TOKEN" ]]; then facebook_configured=true; fi
          all_done=true
          if [[ "$SHOULD_PUBLISH" == true && "$youtube_status" != published ]]; then all_done=false; fi
          if [[ "$PUBLISH_FACEBOOK" == true && "$facebook_configured" == true && ( "$facebook_reel_status" != published || "$facebook_post_status" != published ) ]]; then all_done=false; fi
          if [[ "$all_done" == true && ( "$SHOULD_PUBLISH" == true || ( "$PUBLISH_FACEBOOK" == true && "$facebook_configured" == true ) ) ]]; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "All configured platforms already have a recorded publication; skipping duplicate work."
            exit 0
          fi
          echo "skip_build=false" >> "$GITHUB_OUTPUT"
          promotion_status=ready
          if [[ "$SHOULD_PUBLISH" == "true" && "$youtube_status" != published ]]; then promotion_status=queued; fi
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 \
            -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" -H 'Content-Type: application/json' \
            -d "{\"storyId\":\"$STORY_ID\",\"status\":\"$promotion_status\"}" \
            "$APP_URL/api/promo-status"
          curl -fsSL -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" "$APP_URL/api/video-promo?story=${STORY_ID}" -o build/manifest.json
          curl -fsSL "$(jq -r .cover build/manifest.json)" -o build/cover.png
          curl -fsSL "$(jq -r .audio build/manifest.json)" -o build/voice.mp3
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::OPENAI_API_KEY is missing from GitHub Actions Secrets. Premium cover generation cannot continue."
            exit 1
          fi
          python3 scripts/generate_story_cover.py build/manifest.json build/ai-cover.png
          test -s build/ai-cover.png || { echo "::error::AI cover was not created."; exit 1; }
          mkdir -p assets/brand/audio
          curl -fsSL https://saliio.com/brand/saliio-lockup.png -o assets/brand/saliio-lockup.png
          python3 scripts/generate_brand_audio.py assets/brand/audio
          cp assets/brand/audio/brand-intro.wav assets/brand/audio/01-next-episode-intro.wav
          cp assets/brand/audio/brand-outro.wav assets/brand/audio/01-next-episode-outro.wav
          python3 scripts/render_brand_sting.py intro build/intro-frames build/intro.mp4

          python3 scripts/compose_story_cover.py build/manifest.json build/ai-cover.png assets/brand/saliio-lockup.png build/story-cover.png

          ffmpeg -y -loop 1 -i build/story-cover.png -i build/voice.mp3 -t 35 \
            -vf "format=yuv420p" -map 0:v -map 1:a -c:v libx264 -r 25 -c:a aac -ar 48000 -ac 2 -af "aresample=48000,loudnorm=I=-16:TP=-1.5:LRA=11" -shortest build/main.mp4

          python3 scripts/render_brand_sting.py outro build/outro-frames build/outro.mp4

          ffmpeg -y -i build/intro.mp4 -i build/main.mp4 -i build/outro.mp4 \
            -filter_complex "[0:v]fps=30,setsar=1,format=yuv420p[v0];[1:v]fps=30,setsar=1,format=yuv420p[v1];[2:v]fps=30,setsar=1,format=yuv420p[v2];[0:a]aresample=48000,aformat=sample_fmts=fltp:channel_layouts=stereo[a0];[1:a]aresample=48000,atempo=0.90,aformat=sample_fmts=fltp:channel_layouts=stereo[a1];[2:a]aresample=48000,aformat=sample_fmts=fltp:channel_layouts=stereo[a2];[v0][a0][v1][a1][v2][a2]concat=n=3:v=1:a=1[outv][outa]" \
            -map "[outv]" -map "[outa]" -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -ar 48000 -ac 2 -movflags +faststart build/story-short.mp4


      - name: Save rendered video for review
        if: steps.build-video.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: story-short-${{ steps.build-video.outputs.story_id }}
          path: |
            build/story-short.mp4
            build/story-cover.png
          retention-days: 7

      - name: Upload to YouTube
        id: upload-youtube
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish_to_youtube) && steps.build-video.outputs.youtube_already_published != 'true' && steps.build-video.outputs.skip_build != 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          with open('build/manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          title = manifest.get('title', 'SALIIO')
          teaser = manifest.get('teaser', '')
          story_id = manifest.get('story', '')
          story_url = f'https://saliio.com/he/stories/{story_id}?utm_source=youtube&utm_medium=shorts&utm_campaign={story_id}'
          creds = Credentials(
              token=None,
              refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YOUTUBE_CLIENT_ID'],
              client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/youtube.upload'],
          )
          youtube = build('youtube', 'v3', credentials=creds)
          body = {
              'snippet': {
                  'title': f'{title} — רק עוד פרק',
                  'description': f'{teaser}\n\nהמשיכו לקרוא את הסיפור ב־SALIIO: {story_url}',
                  'categoryId': '24',
                  'tags': ['shorts', 'story', 'SALIIO', 'chat stories', 'רק עוד פרק'],
              },
              'status': {
                  'privacyStatus': 'public',
                  'selfDeclaredMadeForKids': False,
              },
          }
          result = youtube.videos().insert(
              part='snippet,status', body=body,
              media_body=MediaFileUpload('build/story-short.mp4', mimetype='video/mp4', resumable=True),
          ).execute()
          with open('build/youtube-upload.json', 'w', encoding='utf-8') as f:
              json.dump({'videoId': result['id'], 'channelId': result['snippet']['channelId']}, f)
          print('Uploaded YouTube video:', result['id'])
          print('YouTube channel ID:', result['snippet']['channelId'])
          print('Public video URL: https://youtube.com/shorts/' + result['id'])
          PY

      - name: Record promotion result
        if: always() && steps.build-video.outputs.story_id != '' && steps.build-video.outputs.youtube_already_published != 'true' && steps.build-video.outputs.skip_build != 'true'
        env:
          APP_URL: https://saliio.com
          VIDEO_PIPELINE_SECRET: ${{ secrets.VIDEO_PIPELINE_SECRET }}
          STORY_ID: ${{ steps.build-video.outputs.story_id }}
          BUILD_OUTCOME: ${{ steps.build-video.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-youtube.outcome }}
          SHOULD_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_youtube }}
          YOUTUBE_ALREADY_PUBLISHED: ${{ steps.build-video.outputs.youtube_already_published }}
        run: |
          set -euo pipefail
          if [[ "$SHOULD_PUBLISH" != "true" ]]; then
            BODY=$(jq -nc --arg id "$STORY_ID" '{storyId:$id,status:"ready"}')
          elif [[ "$BUILD_OUTCOME" == "success" && "$UPLOAD_OUTCOME" == "success" && -s build/youtube-upload.json ]]; then
            VIDEO_ID=$(jq -er '.videoId' build/youtube-upload.json)
            BODY=$(jq -nc --arg id "$STORY_ID" --arg video "$VIDEO_ID" '{storyId:$id,status:"published",youtubeVideoId:$video}')
          else
            REASON="build_${BUILD_OUTCOME}_upload_${UPLOAD_OUTCOME}"
            BODY=$(jq -nc --arg id "$STORY_ID" --arg error "$REASON" '{storyId:$id,status:"failed",error:$error}')
          fi
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 \
            -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" -H 'Content-Type: application/json' \
            -d "$BODY" "$APP_URL/api/promo-status"

      - name: Publish Facebook Reel
        id: upload-facebook-reel
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish_to_facebook) && steps.build-video.outputs.facebook_reel_already_published != 'true' && steps.build-video.outputs.skip_build != 'true' }}
        env:
          APP_URL: https://saliio.com
          VIDEO_PIPELINE_SECRET: ${{ secrets.VIDEO_PIPELINE_SECRET }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID || '61594944391329' }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v26.0' }}
          STORY_ID: ${{ steps.build-video.outputs.story_id }}
        run: |
          set -euo pipefail
          if [[ -z "$META_PAGE_ID" || -z "$META_PAGE_ACCESS_TOKEN" ]]; then
            echo "::warning::Facebook publishing is not connected yet. Add META_PAGE_ID and META_PAGE_ACCESS_TOKEN to Actions secrets."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          QUEUED=$(jq -nc --arg id "$STORY_ID" '{storyId:$id,platform:"facebook_reel",status:"queued"}')
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 \
            -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" -H 'Content-Type: application/json' \
            -d "$QUEUED" "$APP_URL/api/promo-status"
          python3 scripts/publish_facebook.py reel --output build/facebook-reel.json

      - name: Record Facebook Reel result
        if: always() && steps.build-video.outputs.story_id != '' && steps.build-video.outputs.facebook_reel_already_published != 'true' && steps.build-video.outputs.skip_build != 'true'
        env:
          APP_URL: https://saliio.com
          VIDEO_PIPELINE_SECRET: ${{ secrets.VIDEO_PIPELINE_SECRET }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID || '61594944391329' }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          STORY_ID: ${{ steps.build-video.outputs.story_id }}
          SHOULD_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_facebook }}
          REEL_OUTCOME: ${{ steps.upload-facebook-reel.outcome }}
          REEL_SKIPPED: ${{ steps.upload-facebook-reel.outputs.skipped }}
        run: |
          set -euo pipefail
          if [[ "$SHOULD_PUBLISH" != true || -z "$META_PAGE_ID" || -z "$META_PAGE_ACCESS_TOKEN" ]]; then
            STATUS=ready
            BODY=$(jq -nc --arg id "$STORY_ID" --arg status "$STATUS" '{storyId:$id,platform:"facebook_reel",status:$status}')
          elif [[ "$REEL_OUTCOME" == success && -s build/facebook-reel.json ]]; then
            VIDEO_ID=$(jq -er '.videoId' build/facebook-reel.json)
            BODY=$(jq -nc --arg id "$STORY_ID" --arg video "$VIDEO_ID" '{storyId:$id,platform:"facebook_reel",status:"published",facebookVideoId:$video}')
          else
            REASON="facebook_reel_${REEL_OUTCOME:-unknown}"
            BODY=$(jq -nc --arg id "$STORY_ID" --arg error "$REASON" '{storyId:$id,platform:"facebook_reel",status:"failed",error:$error}')
          fi
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 \
            -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" -H 'Content-Type: application/json' \
            -d "$BODY" "$APP_URL/api/promo-status"

      - name: Publish Facebook Page post
        id: upload-facebook-post
        if: always() && steps.build-video.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish_to_facebook) && steps.build-video.outputs.facebook_post_already_published != 'true' && steps.build-video.outputs.skip_build != 'true'
        env:
          APP_URL: https://saliio.com
          VIDEO_PIPELINE_SECRET: ${{ secrets.VIDEO_PIPELINE_SECRET }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID || '61594944391329' }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v26.0' }}
          STORY_ID: ${{ steps.build-video.outputs.story_id }}
        run: |
          set -euo pipefail
          if [[ -z "$META_PAGE_ID" || -z "$META_PAGE_ACCESS_TOKEN" ]]; then
            echo "::warning::Facebook publishing is not connected yet. Add META_PAGE_ID and META_PAGE_ACCESS_TOKEN to Actions secrets."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          QUEUED=$(jq -nc --arg id "$STORY_ID" '{storyId:$id,platform:"facebook_post",status:"queued"}')
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 \
            -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" -H 'Content-Type: application/json' \
            -d "$QUEUED" "$APP_URL/api/promo-status"
          python3 scripts/publish_facebook.py post --output build/facebook-post.json

      - name: Record Facebook Page post result
        if: always() && steps.build-video.outputs.story_id != '' && steps.build-video.outputs.facebook_post_already_published != 'true' && steps.build-video.outputs.skip_build != 'true'
        env:
          APP_URL: https://saliio.com
          VIDEO_PIPELINE_SECRET: ${{ secrets.VIDEO_PIPELINE_SECRET }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID || '61594944391329' }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          STORY_ID: ${{ steps.build-video.outputs.story_id }}
          SHOULD_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_facebook }}
          POST_OUTCOME: ${{ steps.upload-facebook-post.outcome }}
        run: |
          set -euo pipefail
          if [[ "$SHOULD_PUBLISH" != true || -z "$META_PAGE_ID" || -z "$META_PAGE_ACCESS_TOKEN" ]]; then
            BODY=$(jq -nc --arg id "$STORY_ID" '{storyId:$id,platform:"facebook_post",status:"ready"}')
          elif [[ "$POST_OUTCOME" == success && -s build/facebook-post.json ]]; then
            POST_ID=$(jq -er '.postId' build/facebook-post.json)
            BODY=$(jq -nc --arg id "$STORY_ID" --arg post "$POST_ID" '{storyId:$id,platform:"facebook_post",status:"published",facebookPostId:$post}')
          else
            REASON="facebook_post_${POST_OUTCOME:-unknown}"
            BODY=$(jq -nc --arg id "$STORY_ID" --arg error "$REASON" '{storyId:$id,platform:"facebook_post",status:"failed",error:$error}')
          fi
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 \
            -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" -H 'Content-Type: application/json' \
            -d "$BODY" "$APP_URL/api/promo-status"
