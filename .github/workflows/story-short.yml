name: Generate and publish story short

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: Story ID to promote (for example tenants-only)
        required: true
        type: string
  schedule:
    - cron: '30 18 * * *'

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick python3-pip fonts-noto-core
          python3 -m pip install --upgrade google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Build vertical short
        env:
          STORY_ID: ${{ inputs.story_id || 'tenants-only' }}
          APP_URL: https://get-next-episode-bot.byd-karaoke-israel.workers.dev
          VIDEO_PIPELINE_SECRET: ${{ secrets.VIDEO_PIPELINE_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p build
          curl -fsSL -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" "$APP_URL/api/video-promo?story=${STORY_ID}" -o build/manifest.json
          curl -fsSL "$(jq -r .cover build/manifest.json)" -o build/cover.png
          curl -fsSL "$(jq -r .audio build/manifest.json)" -o build/voice.mp3
          curl -fsSL https://raw.githubusercontent.com/Getnextepisode/get-next-episode-video-pipeline/main/assets/get-next-episode-logo-red.png.b64 -o build/logo.png.b64
          base64 --decode build/logo.png.b64 > build/logo.png
          python3 - <<'PY'
          import json, re, textwrap
          m=json.load(open('build/manifest.json',encoding='utf-8'))
          clean=lambda s: re.sub(r'[^A-Za-z0-9\u0590-\u05FF .,!?-]', '', str(s))
          title=clean(m.get('title','Get Next Episode'))
          teaser=clean(m.get('teaser',''))
          genre=clean(m.get('genre',m.get('category','')))
          genre_map={'Urban thriller':'מתח אורבני','Thriller':'מותחן','Mystery':'מסתורין','Romance':'רומנטיקה','Drama':'דרמה','Horror':'אימה'}
          genre=genre_map.get(genre,genre or 'סיפור מקורי')
          rating=m.get('rating') or 4.8
          readers=m.get('readers') or m.get('views') or '18.4K'
          if isinstance(readers,(int,float)):
              readers=f'{readers/1000:.1f}K' if readers>=1000 else str(readers)
          words=teaser.split()
          pivot=max(1,len(words)//2)
          msg1=' '.join(words[:pivot])
          msg2=' '.join(words[pivot:])
          title_lines=textwrap.wrap(title,18)[:2]
          open('build/title.txt','w',encoding='utf-8').write('\n'.join(title_lines))
          open('build/genre.txt','w',encoding='utf-8').write(genre)
          open('build/promise.txt','w',encoding='utf-8').write("סיפורים שנקראים כמו צ'אט.\nנשמעים כמו סדרה.")
          open('build/message1.txt','w',encoding='utf-8').write('\n'.join(textwrap.wrap(msg1,18)[:2]))
          open('build/message2.txt','w',encoding='utf-8').write('\n'.join(textwrap.wrap(msg2,18)[:2]))
          open('build/details.txt','w',encoding='utf-8').write(f"★ {rating}  •  {readers} קוראים")
          open('build/cta.txt','w',encoding='utf-8').write("לקרוא או להאזין לפרק הראשון")
          PY
          ffmpeg -y -f lavfi -i color=c=black:s=1080x1920:d=2 -i build/logo.png -f lavfi -i sine=frequency=440:duration=2 \
            -filter_complex "[1:v]scale=360:-1[logo];[0:v][logo]overlay=(W-w)/2:650,format=yuv420p[v]" \
            -map "[v]" -map 2:a -t 2 -c:v libx264 -c:a aac -ar 48000 -ac 2 build/intro.mp4

          ffmpeg -y -i build/cover.png -i build/logo.png \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,drawbox=x=0:y=0:w=1080:h=1920:color=black@0.43:t=fill,drawbox=x=0:y=0:w=1080:h=280:color=black@0.32:t=fill,drawbox=x=0:y=300:w=1080:h=570:color=black@0.22:t=fill,drawbox=x=0:y=1420:w=1080:h=500:color=black@0.25:t=fill[bg];[1:v]scale=165:-1[logo];[bg][logo]overlay=70:75,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='GET NEXT':fontcolor=white:fontsize=48:x=265:y=100,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='EPISODE':fontcolor=0xffff1f3b:fontsize=48:x=530:y=100,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='READ  •  LISTEN  •  CHAT STORIES':fontcolor=white:fontsize=27:x=265:y=170,drawtext=fontfile=/usr/share/fonts/truetype/noto/NotoSansHebrew-Bold.ttf:textfile=build/genre.txt:fontcolor=0xffff1f3b:fontsize=45:borderw=2:bordercolor=black@0.8:x=70:y=350,drawtext=fontfile=/usr/share/fonts/truetype/noto/NotoSansHebrew-Bold.ttf:textfile=build/title.txt:fontcolor=white:fontsize=126:borderw=5:bordercolor=black@0.95:shadowx=5:shadowy=7:shadowcolor=black@0.8:x=70:y=430,drawbox=x=60:y=635:w=880:h=185:color=black@0.48:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/noto/NotoSansHebrew-Bold.ttf:textfile=build/promise.txt:fontcolor=white:fontsize=50:line_spacing=18:x=95:y=675,drawbox=x=70:y=870:w=475:h=225:color=0x101721@0.92:t=fill,drawbox=x=70:y=870:w=475:h=225:color=white@0.25:t=3,drawbox=x=105:y=940:w=72:h=72:color=0xffff1f3b@0.98:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='▶':fontcolor=white:fontsize=42:x=122:y=953,drawbox=x=215:y=958:w=9:h=38:color=0xffff1f3b:t=fill,drawbox=x=239:y=935:w=9:h=84:color=white:t=fill,drawbox=x=263:y=950:w=9:h=54:color=0xffff1f3b:t=fill,drawbox=x=287:y=925:w=9:h=104:color=white:t=fill,drawbox=x=311:y=945:w=9:h=64:color=0xffff1f3b:t=fill,drawbox=x=335:y=935:w=9:h=84:color=white:t=fill,drawbox=x=359:y=958:w=9:h=38:color=0xffff1f3b:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='0\:37':fontcolor=white@0.85:fontsize=31:x=450:y=964,drawbox=x=590:y=875:w=420:h=102:color=0x11151d@0.92:t=fill,drawbox=x=625:y=995:w=360:h=102:color=0x11151d@0.92:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/noto/NotoSansHebrew-Regular.ttf:textfile=build/message1.txt:fontcolor=white:fontsize=31:line_spacing=7:x=620:y=895,drawtext=fontfile=/usr/share/fonts/truetype/noto/NotoSansHebrew-Regular.ttf:textfile=build/message2.txt:fontcolor=white:fontsize=31:line_spacing=7:x=655:y=1015,drawtext=fontfile=/usr/share/fonts/truetype/noto/NotoSansHebrew-Bold.ttf:textfile=build/details.txt:fontcolor=0xffffc83d:fontsize=48:borderw=2:bordercolor=black@0.8:x=80:y=1190,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CHAT   |   AUDIO':fontcolor=white:fontsize=34:x=690:y=1198,drawbox=x=125:y=1510:w=830:h=150:color=0xffd90920@0.97:t=fill,drawbox=x=125:y=1510:w=830:h=150:color=0xffff5161:t=4,drawtext=fontfile=/usr/share/fonts/truetype/noto/NotoSansHebrew-Bold.ttf:textfile=build/cta.txt:fontcolor=white:fontsize=48:borderw=2:bordercolor=black@0.4:x=(w-text_w)/2:y=1558,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='@GetNextEpisodeBot':fontcolor=0xffff1f3b:fontsize=48:borderw=2:bordercolor=black@0.8:x=(w-text_w)/2:y=1705,format=rgba[v]" \
            -map "[v]" -frames:v 1 build/story-cover.png

          ffmpeg -y -loop 1 -i build/story-cover.png -i build/voice.mp3 -t 35 \
            -vf "format=yuv420p" -map 0:v -map 1:a -c:v libx264 -r 25 -c:a aac -ar 48000 -ac 2 -af "aresample=48000,loudnorm=I=-16:TP=-1.5:LRA=11" -shortest build/main.mp4

          ffmpeg -y -f lavfi -i color=c=black:s=1080x1920:d=2 -i build/logo.png -f lavfi -i sine=frequency=330:duration=2 \
            -filter_complex "[1:v]scale=300:-1[logo];[0:v][logo]overlay=(W-w)/2:560,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CONTINUE THE STORY':fontcolor=white:fontsize=52:x=(w-text_w)/2:y=1050,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='@GetNextEpisodeBot':fontcolor=red:fontsize=48:x=(w-text_w)/2:y=1140,format=yuv420p[v]" \
            -map "[v]" -map 2:a -t 2 -c:v libx264 -c:a aac -ar 48000 -ac 2 build/outro.mp4

          printf "file '%s'\\nfile '%s'\\nfile '%s'\\n" "$PWD/build/intro.mp4" "$PWD/build/main.mp4" "$PWD/build/outro.mp4" > build/concat.txt
          ffmpeg -y -f concat -safe 0 -i build/concat.txt -c:v libx264 -c:a aac -ar 48000 -ac 2 -movflags +faststart build/story-short.mp4

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          with open('build/manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          title = manifest.get('title', 'GetNextEpisode')
          teaser = manifest.get('teaser', '')
          creds = Credentials(
              token=None,
              refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YOUTUBE_CLIENT_ID'],
              client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/youtube.upload'],
          )
          youtube = build('youtube', 'v3', credentials=creds)
          body = {
              'snippet': {
                  'title': f'{title} — רק עוד פרק',
                  'description': f'{teaser}\n\nהמשך הסיפור מחכה ב-GetNextEpisodeBot: https://t.me/GetNextEpisodeBot',
                  'categoryId': '24',
                  'tags': ['shorts', 'story', 'GetNextEpisode', 'רק עוד פרק'],
              },
              'status': {
                  'privacyStatus': 'public',
                  'selfDeclaredMadeForKids': False,
              },
          }
          result = youtube.videos().insert(
              part='snippet,status', body=body,
              media_body=MediaFileUpload('build/story-short.mp4', mimetype='video/mp4', resumable=True),
          ).execute()
          print('Uploaded YouTube video:', result['id'])
          PY
