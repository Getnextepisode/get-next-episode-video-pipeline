name: Generate and publish story short

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: Story ID to promote (for example tenants-only)
        required: true
        type: string
  schedule:
    - cron: '30 18 * * *'

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick python3-pip
          python3 -m pip install --upgrade google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Build vertical short
        env:
          STORY_ID: ${{ inputs.story_id || 'tenants-only' }}
          APP_URL: https://get-next-episode-bot.byd-karaoke-israel.workers.dev
          VIDEO_PIPELINE_SECRET: ${{ secrets.VIDEO_PIPELINE_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p build
          curl -fsSL -H "X-Video-Pipeline-Key: $VIDEO_PIPELINE_SECRET" "$APP_URL/api/video-promo?story=${STORY_ID}" -o build/manifest.json
          curl -fsSL "$(jq -r .cover build/manifest.json)" -o build/cover.png
          curl -fsSL "$(jq -r .audio build/manifest.json)" -o build/voice.mp3
          curl -fsSL https://raw.githubusercontent.com/Getnextepisode/get-next-episode-video-pipeline/main/assets/logo-original.png.b64 -o build/logo.png.b64
          base64 --decode build/logo.png.b64 > build/logo.png
          python3 - <<'PY'
          import json, re
          m=json.load(open('build/manifest.json',encoding='utf-8'))
          clean=lambda s: re.sub(r'[^A-Za-z0-9\u0590-\u05FF .,!?-]', '', str(s))
          open('build/title.txt','w',encoding='utf-8').write(clean(m.get('title','Get Next Episode')))
          open('build/tagline.txt','w',encoding='utf-8').write(clean(m.get('teaser','')))
          import textwrap
          teaser=clean(m.get('teaser',''))
          open('build/tagline.txt','w',encoding='utf-8').write('\n'.join(textwrap.wrap(teaser,32)[:3]))
          genre=clean(m.get('genre',m.get('category','ORIGINAL STORY')))
          open('build/genre.txt','w',encoding='utf-8').write(genre.upper())
          rating=m.get('rating',4.8)
          readers=m.get('readers',m.get('views',''))
          open('build/details.txt','w',encoding='utf-8').write(clean(f"{rating} / 5   |   {readers} readers"))
          PY
          ffmpeg -y -f lavfi -i color=c=black:s=1080x1920:d=2 -i build/logo.png -f lavfi -i sine=frequency=440:duration=2 \
            -filter_complex "[1:v]scale=360:-1[logo];[0:v][logo]overlay=(W-w)/2:650,format=yuv420p[v]" \
            -map "[v]" -map 2:a -t 2 -c:v libx264 -c:a aac -ar 48000 -ac 2 build/intro.mp4

          ffmpeg -y -i build/cover.png -i build/logo.png \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,drawbox=x=0:y=0:w=1080:h=1920:color=black@0.28:t=fill[bg];[1:v]scale=230:-1[logo];[bg][logo]overlay=70:70,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='GET NEXT':fontcolor=white:fontsize=46:x=340:y=120,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='EPISODE':fontcolor=red:fontsize=46:x=620:y=120,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=build/genre.txt:fontcolor=#ff3347:fontsize=42:x=80:y=470,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=build/title.txt:fontcolor=white:fontsize=104:borderw=4:bordercolor=black@0.9:x=80:y=550,drawbox=x=70:y=760:w=940:h=430:color=#07101f@0.78:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:textfile=build/tagline.txt:fontcolor=white:fontsize=48:line_spacing=20:x=110:y=820,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=build/details.txt:fontcolor=#f5c451:fontsize=40:x=110:y=1090,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='LISTEN NOW':fontcolor=white:fontsize=42:x=80:y=1700,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='@GetNextEpisodeBot':fontcolor=#ff3347:fontsize=46:x=80:y=1770,format=rgba[v]" \
            -map "[v]" -frames:v 1 build/story-cover.png

          ffmpeg -y -loop 1 -i build/story-cover.png -i build/voice.mp3 -t 35 \
            -vf "format=yuv420p" -map 0:v -map 1:a -c:v libx264 -r 25 -c:a aac -ar 48000 -ac 2 -af "aresample=48000,loudnorm=I=-16:TP=-1.5:LRA=11" -shortest build/main.mp4

          ffmpeg -y -f lavfi -i color=c=black:s=1080x1920:d=2 -i build/logo.png -f lavfi -i sine=frequency=330:duration=2 \
            -filter_complex "[1:v]scale=300:-1[logo];[0:v][logo]overlay=(W-w)/2:560,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CONTINUE THE STORY':fontcolor=white:fontsize=52:x=(w-text_w)/2:y=1050,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='@GetNextEpisodeBot':fontcolor=red:fontsize=48:x=(w-text_w)/2:y=1140,format=yuv420p[v]" \
            -map "[v]" -map 2:a -t 2 -c:v libx264 -c:a aac -ar 48000 -ac 2 build/outro.mp4

          printf "file '%s'\\nfile '%s'\\nfile '%s'\\n" "$PWD/build/intro.mp4" "$PWD/build/main.mp4" "$PWD/build/outro.mp4" > build/concat.txt
          ffmpeg -y -f concat -safe 0 -i build/concat.txt -c:v libx264 -c:a aac -ar 48000 -ac 2 -movflags +faststart build/story-short.mp4

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          with open('build/manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          title = manifest.get('title', 'GetNextEpisode')
          teaser = manifest.get('teaser', '')
          creds = Credentials(
              token=None,
              refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YOUTUBE_CLIENT_ID'],
              client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/youtube.upload'],
          )
          youtube = build('youtube', 'v3', credentials=creds)
          body = {
              'snippet': {
                  'title': f'{title} — רק עוד פרק',
                  'description': f'{teaser}\n\nהמשך הסיפור מחכה ב-GetNextEpisodeBot: https://t.me/GetNextEpisodeBot',
                  'categoryId': '24',
                  'tags': ['shorts', 'story', 'GetNextEpisode', 'רק עוד פרק'],
              },
              'status': {
                  'privacyStatus': 'public',
                  'selfDeclaredMadeForKids': False,
              },
          }
          result = youtube.videos().insert(
              part='snippet,status', body=body,
              media_body=MediaFileUpload('build/story-short.mp4', mimetype='video/mp4', resumable=True),
          ).execute()
          print('Uploaded YouTube video:', result['id'])
          PY
